name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render example envs
        run: |
          cp core-node/.env.example core-node/.env
          cp apps-node/.env.example apps-node/.env
      - name: Validate core-node compose
        run: docker compose --project-directory core-node --env-file core-node/.env config -q
      - name: Validate apps-node compose
        run: docker compose --project-directory apps-node --env-file apps-node/.env config -q
      - name: Validate application stacks
        run: |
          for d in apps-node/apps/*/; do
            [ "$(basename "$d")" = "_template" ] && continue
            echo "== $d"
            docker compose --project-directory "$d" --env-file "$d/.env.example" config -q
          done

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -S warning scripts/*.sh scripts/lib/*.sh core-node/postgres/initdb/*.sh
