# Traefik v3 static configuration (core-node).
# Dynamic routing comes from Docker labels + ./dynamic/*.yml.
# The ACME email is injected via the TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL
# environment variable (see docker-compose.yml).

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true

ping:
  entryPoint: web

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      middlewares:
        - security-headers@file
    transport:
      respondingTimeouts:
        readTimeout: "600s"      # large uploads (Nextcloud etc. proxied here in single-Traefik setups)

providers:
  docker:
    exposedByDefault: false
    network: edge
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      storage: /acme/acme.json
      tlsChallenge: {}
      # For staging while testing, uncomment:
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory

log:
  level: INFO
  format: json

accessLog:
  format: json
  filters:
    statusCodes:
      - "400-499"
      - "500-599"
