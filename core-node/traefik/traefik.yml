# Traefik v3 static configuration (core-node).
# Dynamic routing comes from Docker labels + ./dynamic/*.yml.
# The ACME email is injected via the TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL
# environment variable (see docker-compose.yml).

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true

ping:
  entryPoint: web

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    # NOTE: security headers are deliberately NOT set here at the entrypoint
    # level. An entrypoint-level middleware applies to every router on this
    # entrypoint unconditionally, on top of whatever the router declares
    # itself - which silently broke Keycloak (it needs SAMEORIGIN framing,
    # not the blanket security-headers@file's DENY, but couldn't opt out of
    # an entrypoint-level middleware no matter what its own router used).
    # Every router instead declares security-headers@file (or
    # security-headers-frameable@file) explicitly in its own labels.
    transport:
      respondingTimeouts:
        readTimeout: "600s"      # large uploads (Nextcloud etc. proxied here in single-Traefik setups)

providers:
  docker:
    exposedByDefault: false
    network: edge
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      storage: /acme/acme.json
      tlsChallenge: {}
      # For staging while testing, uncomment:
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory

log:
  level: INFO
  format: json

accessLog:
  format: json
  filters:
    statusCodes:
      - "400-499"
      - "500-599"
