# =============================================================================
# meenerva-infra :: core-node stack
# Runs on: Contabo Cloud VPS 6 (core-node, WireGuard 10.10.0.1)
# Bootstrapped once over SSH with `make core-up`, then managed as a Portainer
# Git stack. Every value comes from core-node/.env (see .env.example).
# =============================================================================

name: meenerva-core

# -----------------------------------------------------------------------------
# Networks
#   edge          : public-facing, Traefik + anything that needs an HTTP route
#   core-internal : no internet gateway; data stores + internal service traffic
# -----------------------------------------------------------------------------
networks:
  edge:
    name: edge
    driver: bridge
  core-internal:
    name: core-internal
    driver: bridge
    internal: true

# -----------------------------------------------------------------------------
# Volumes (all backed up to Backblaze B2 except where noted)
# -----------------------------------------------------------------------------
volumes:
  traefik-acme:       # Let's Encrypt account + issued certs (regenerable)
  portainer-data:
  postgres-data:
  redis-data:
  keycloak-data:      # imports/exports; realm state is in PostgreSQL
  stalwart-data:      # mailboxes + full-text index + generated keys (CRITICAL)
  n8n-data:           # workflows + encrypted credentials (CRITICAL)
  stalwart-etc:       # Stalwart's own settings store (domain, DKIM, directory, ACME)
  webmail-data:       # Bulwark Webmail settings store
  backup-dumps:       # local rotating pg_dump output, shared with offsite-backup

services:

  # ===========================================================================
  # Traefik v3 :: edge reverse proxy + automatic TLS
  # ===========================================================================
  traefik:
    image: traefik:v3.7.13
    container_name: core-traefik
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [edge, core-internal]
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: ${TZ}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/acme
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.traefik.rule: Host(`traefik.${PRIMARY_DOMAIN}`)
      traefik.http.routers.traefik.entrypoints: websecure
      traefik.http.routers.traefik.tls.certresolver: letsencrypt
      traefik.http.routers.traefik.service: api@internal
      traefik.http.middlewares.dashboard-auth.basicauth.users: ${TRAEFIK_DASHBOARD_AUTH}
      traefik.http.routers.traefik.middlewares: dashboard-auth,security-headers@file
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 20s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Portainer CE :: visual container + stack management
  # ===========================================================================
  portainer:
    image: portainer/portainer-ce:2.45.0
    container_name: core-portainer
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [edge]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.portainer.rule: Host(`portainer.${PRIMARY_DOMAIN}`)
      traefik.http.routers.portainer.entrypoints: websecure
      traefik.http.routers.portainer.tls.certresolver: letsencrypt
      traefik.http.routers.portainer.middlewares: security-headers@file
      traefik.http.services.portainer.loadbalancer.server.port: "9000"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # PostgreSQL 16 :: shared database, one DB + role per app (see postgres/initdb)
  # Not published publicly. Bound to the WireGuard IP for apps-node access.
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: core-postgres
    restart: unless-stopped
    networks: [core-internal]
    ports:
      - "${POSTGRES_WG_BIND_IP}:5432:5432"   # WireGuard interface only
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_DB: postgres
      TZ: ${TZ}
      # Consumed by the initdb scripts to create per-app databases:
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD}
      STALWART_DB_PASSWORD: ${STALWART_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "work_mem=8MB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 3g

  # ===========================================================================
  # Redis 7 :: shared cache / queue backend. Password-protected, WG-bound.
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: core-redis
    restart: unless-stopped
    networks: [core-internal]
    ports:
      - "${REDIS_WG_BIND_IP}:6379:6379"      # WireGuard interface only
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 384m

  # ===========================================================================
  # Keycloak 26 :: central identity provider (OIDC / SAML), MFA
  # Uses core-postgres (database app_keycloak).
  # ===========================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    container_name: core-keycloak
    restart: unless-stopped
    # `start` (not `start --optimized`) runs an implicit build on boot, so the
    # DB vendor / proxy options below are applied without a custom image. Switch
    # to `start --optimized` only once you bake a pre-built Keycloak image.
    command: ["start"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge, core-internal]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://core-postgres:5432/app_keycloak
      KC_DB_USERNAME: app_keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: https://${KEYCLOAK_HOST}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_CACHE: local
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      JAVA_OPTS_APPEND: ${KEYCLOAK_JVM_HEAP}
    volumes:
      - keycloak-data:/opt/keycloak/data
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.keycloak.rule: Host(`${KEYCLOAK_HOST}`)
      traefik.http.routers.keycloak.entrypoints: websecure
      traefik.http.routers.keycloak.tls.certresolver: letsencrypt
      traefik.http.routers.keycloak.middlewares: security-headers@file
      traefik.http.services.keycloak.loadbalancer.server.port: "8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    mem_limit: 1280m

  # ===========================================================================
  # Stalwart Mail Server :: SMTP / IMAP / JMAP / Sieve, DKIM signing
  # Mail protocol ports are published directly on the host (see docs/05).
  # HTTP surface (admin UI + JMAP + autoconfig) is routed through Traefik.
  #
  # v0.16+ no longer reads a config.toml: all settings (domain, DKIM, directory,
  # relay, ACME) live in Stalwart's own store and are set through the first-run
  # setup wizard (http://<host>:8080/admin) and the web admin UI afterwards.
  # STALWART_RECOVERY_ADMIN seeds the initial administrator so login works even
  # before the wizard is completed; STALWART_PUBLIC_URL tells Stalwart its own
  # externally-reachable HTTPS URL (used for autoconfig/autodiscover/links).
  # ===========================================================================
  stalwart:
    image: stalwartlabs/stalwart:v0.16.21-alpine
    container_name: core-stalwart
    restart: unless-stopped
    networks: [edge, core-internal]
    ports:
      - "25:25"       # SMTP  (inbound MX)
      - "465:465"     # SMTPS (implicit TLS)
      - "587:587"     # submission (STARTTLS) - also the apps-node relay target via WG
      - "143:143"     # IMAP
      - "993:993"     # IMAPS
      - "4190:4190"   # ManageSieve
    environment:
      TZ: ${TZ}
      STALWART_RECOVERY_ADMIN: admin:${STALWART_ADMIN_PASSWORD}
      STALWART_PUBLIC_URL: https://${STALWART_ADMIN_HOST}
    volumes:
      - stalwart-etc:/etc/stalwart      # Stalwart's own config store (was config.toml pre-0.16)
      - stalwart-data:/var/lib/stalwart # mailboxes + full-text index (CRITICAL, see D-07)
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      # Admin UI + JMAP + autoconfig/autodiscover over HTTPS
      traefik.http.routers.stalwart.rule: Host(`${STALWART_ADMIN_HOST}`) || Host(`autoconfig.${PRIMARY_DOMAIN}`) || Host(`autodiscover.${PRIMARY_DOMAIN}`)
      traefik.http.routers.stalwart.entrypoints: websecure
      traefik.http.routers.stalwart.tls.certresolver: letsencrypt
      traefik.http.routers.stalwart.middlewares: security-headers@file
      traefik.http.services.stalwart.loadbalancer.server.port: "8080"
      # Forward the ACME HTTP-01 challenge to Stalwart so it can manage its own
      # certificates for the mail protocol ports (challenge = "http-01").
      traefik.http.routers.stalwart-acme.rule: Host(`${STALWART_ADMIN_HOST}`) && PathPrefix(`/.well-known/acme-challenge/`)
      traefik.http.routers.stalwart-acme.entrypoints: web
      traefik.http.routers.stalwart-acme.service: stalwart
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g

  # ===========================================================================
  # Bulwark Webmail :: native JMAP web client for Stalwart (Mail + Calendar +
  # Contacts + Files in one UI). Standalone / fallback client (decision D-11):
  # the PRIMARY day-to-day client is the Nextcloud Mail app on apps-node, but
  # Bulwark keeps working when apps-node is down and gives a fast, mail-first UI.
  # It talks JMAP to Stalwart over the PUBLIC endpoint so the TLS name matches
  # and OAuth discovery works.
  #   Project: https://github.com/bulwarkmail/webmail
  # ===========================================================================
  webmail:
    image: ghcr.io/bulwarkmail/webmail:latest   # pin to a released digest before production (young project, no semver tags yet)
    container_name: core-webmail
    restart: unless-stopped
    depends_on: [stalwart]
    networks: [edge]
    environment:
      TZ: ${TZ}
      APP_NAME: "MEENERVA Mail"
      PORT: "3000"
      JMAP_SERVER_URL: https://${STALWART_ADMIN_HOST}
      SESSION_SECRET: ${WEBMAIL_SESSION_SECRET}
      # SSO via Keycloak (endpoints auto-discovered from the issuer). Start with
      # WEBMAIL_OAUTH_ENABLED=false (password login against Stalwart), then set it
      # to true once the Keycloak `webmail` client exists and redeploy.
      OAUTH_ENABLED: ${WEBMAIL_OAUTH_ENABLED:-false}
      OAUTH_CLIENT_ID: ${WEBMAIL_OAUTH_CLIENT_ID:-webmail}
      OAUTH_CLIENT_SECRET: ${WEBMAIL_OAUTH_CLIENT_SECRET:-}
      OAUTH_ISSUER_URL: https://${KEYCLOAK_HOST}/realms/meenerva
    volumes:
      - webmail-data:/app/data
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.webmail.rule: Host(`${WEBMAIL_HOST}`)
      traefik.http.routers.webmail.entrypoints: websecure
      traefik.http.routers.webmail.tls.certresolver: letsencrypt
      traefik.http.routers.webmail.middlewares: security-headers@file
      traefik.http.services.webmail.loadbalancer.server.port: "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m

  # ===========================================================================
  # n8n :: workflow automation (onboarding / offboarding / reporting)
  # Uses core-postgres (app_n8n) and sends mail via core-stalwart:587.
  # First candidate to relocate to apps-node if core RAM gets tight.
  # ===========================================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:1.68.0
    container_name: core-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks: [edge, core-internal]
    environment:
      TZ: ${TZ}
      GENERIC_TIMEZONE: ${TZ}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      NODE_ENV: production
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: core-postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: app_n8n
      DB_POSTGRESDB_USER: app_n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_SMTP_SENDER: no-reply@${PRIMARY_DOMAIN}
      N8N_EMAIL_MODE: smtp
      N8N_SMTP_HOST: core-stalwart
      N8N_SMTP_PORT: "587"
      N8N_SMTP_SSL: "false"
      N8N_SMTP_STARTTLS: "true"
      N8N_SMTP_USER: no-reply@${PRIMARY_DOMAIN}
      N8N_SMTP_PASS: ${N8N_SMTP_PASSWORD}
    volumes:
      - n8n-data:/home/node/.n8n
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.n8n.rule: Host(`${N8N_HOST}`)
      traefik.http.routers.n8n.entrypoints: websecure
      traefik.http.routers.n8n.tls.certresolver: letsencrypt
      traefik.http.routers.n8n.middlewares: security-headers@file
      traefik.http.services.n8n.loadbalancer.server.port: "5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 640m

  # ===========================================================================
  # postgres-backup :: nightly rotating per-database SQL dumps (local)
  # ===========================================================================
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: core-postgres-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks: [core-internal]
    environment:
      POSTGRES_HOST: core-postgres
      POSTGRES_DB: "postgres,app_keycloak,app_n8n,app_stalwart"
      POSTGRES_USER: ${POSTGRES_SUPERUSER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_EXTRA_OPTS: "--clean --if-exists"
      SCHEDULE: ${BACKUP_CRON}
      BACKUP_KEEP_DAYS: ${BACKUP_RETENTION_DAYS}
      BACKUP_KEEP_WEEKS: "8"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - backup-dumps:/backups
    mem_limit: 128m

  # ===========================================================================
  # offsite-backup :: encrypt dumps + stateful volumes, push to Backblaze B2
  # ===========================================================================
  offsite-backup:
    image: offen/docker-volume-backup:v2.43.0
    container_name: core-offsite-backup
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: ${BACKUP_CRON}
      BACKUP_FILENAME: "meenerva-core-%Y%m%dT%H%M%S.tar.gz"
      BACKUP_PRUNING_PREFIX: "meenerva-core-"
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      GPG_PASSPHRASE: ${RESTIC_PASSWORD}
      AWS_ENDPOINT: ${B2_S3_ENDPOINT}
      AWS_S3_BUCKET_NAME: ${B2_BUCKET}
      AWS_ACCESS_KEY_ID: ${B2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${B2_SECRET_ACCESS_KEY}
      AWS_S3_PATH: core-node
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - backup-dumps:/backup/pg-dumps:ro
      - stalwart-data:/backup/stalwart-data:ro
      - stalwart-etc:/backup/stalwart-etc:ro
      - n8n-data:/backup/n8n-data:ro
      - webmail-data:/backup/webmail-data:ro
      - portainer-data:/backup/portainer-data:ro
      - traefik-acme:/backup/traefik-acme:ro
    mem_limit: 256m
