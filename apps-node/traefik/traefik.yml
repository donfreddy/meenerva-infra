# Traefik v3 static configuration (apps-node). Mirror of core-node/traefik/traefik.yml.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

api:
  dashboard: true

ping:
  entryPoint: web

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      middlewares:
        - security-headers@file
    transport:
      respondingTimeouts:
        readTimeout: "600s"

providers:
  docker:
    exposedByDefault: false
    network: edge
    watch: true
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      storage: /acme/acme.json
      tlsChallenge: {}

log:
  level: INFO
  format: json

accessLog:
  format: json
  filters:
    statusCodes:
      - "400-499"
      - "500-599"
