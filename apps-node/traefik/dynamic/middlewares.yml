# Shared Traefik middlewares (apps-node). Keep in sync with core-node.

http:
  middlewares:

    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        customResponseHeaders:
          X-Robots-Tag: "noindex,nofollow"
          Server: ""

    rate-limit:
      rateLimit:
        average: 100
        burst: 50

    compress:
      compress: {}

    # Nextcloud / Collabora expect these; attach per-app as needed.
    nextcloud-caldav:
      redirectRegex:
        regex: "https://(.*)/.well-known/(card|cal)dav"
        replacement: "https://${1}/remote.php/dav/"
        permanent: true
