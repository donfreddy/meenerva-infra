# =============================================================================
# EspoCRM :: CRM, on apps-node
#   crm.meenerva.io
# Database: app_espocrm on the shared apps-mariadb (apps-node/docker-compose.yml
# - EspoCRM supports MySQL/MariaDB only, not Postgres, hence the separate
# shared engine from core-postgres). No Redis needed.
#
# Two containers: `espocrm` (web) and `espocrm-daemon` (cron - scheduled
# jobs, workflow processing, outbound email queue). Both must run for the app
# to work correctly; the daemon has no HTTP endpoint of its own so it gets no
# Traefik labels and no healthcheck (matches upstream, which does not define
# one for it either).
#
# Volumes: only `data`, `custom`, and `client/custom` are mounted - NOT the
# whole /var/www/html. Confirmed live 2026-09-13: mounting the whole tree is
# EspoCRM's "legacy installation method" (its own entrypoint says so at
# startup) and permanently blocks in-place upgrades from ever working again.
# `espocrm-daemon` uses `volumes_from: [espocrm]` so both containers always
# see the exact same three mounts - no risk of the list drifting out of sync
# between the two service definitions.
# =============================================================================

name: meenerva-espocrm

networks:
  edge:
    external: true
  apps-internal:
    external: true

volumes:
  espocrm-data:           # attachments, generated config.php, uploads - add to offsite-backup
  espocrm-custom:         # custom backend code/extensions - add to offsite-backup
  espocrm-client-custom:  # custom frontend code - add to offsite-backup

services:
  espocrm:
    image: espocrm/espocrm:10.0.6-apache
    container_name: apps-espocrm
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [edge, apps-internal]
    environment:
      TZ: ${TZ}

      # --- database (shared apps-mariadb, same node - see docker-compose.yml
      # comment in apps-node/ for why this doesn't need the mesh) ---
      ESPOCRM_DATABASE_PLATFORM: Mysql
      ESPOCRM_DATABASE_HOST: apps-mariadb
      ESPOCRM_DATABASE_PORT: "3306"
      ESPOCRM_DATABASE_NAME: app_espocrm
      ESPOCRM_DATABASE_USER: app_espocrm
      ESPOCRM_DATABASE_PASSWORD: ${ESPOCRM_DB_PASSWORD}

      # --- site ---
      ESPOCRM_SITE_URL: "https://crm.${PRIMARY_DOMAIN}"

      # --- admin bootstrap (only used on first install, unlike Nextcloud's
      # web-wizard race window - see README.md) ---
      ESPOCRM_ADMIN_USERNAME: ${ESPOCRM_ADMIN_USERNAME}
      ESPOCRM_ADMIN_PASSWORD: ${ESPOCRM_ADMIN_PASSWORD}

      # --- outbound mail is NOT set via env here (no documented env var for
      # it) - configure under Administration > Outbound Emails after first
      # login, pointed at Stalwart. See README.md.
    volumes:
      - espocrm-data:/var/www/html/data
      - espocrm-custom:/var/www/html/custom
      - espocrm-client-custom:/var/www/html/client/custom
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.espocrm.rule: Host(`crm.${PRIMARY_DOMAIN}`)
      traefik.http.routers.espocrm.entrypoints: websecure
      traefik.http.routers.espocrm.tls.certresolver: letsencrypt
      traefik.http.routers.espocrm.middlewares: security-headers@file
      traefik.http.services.espocrm.loadbalancer.server.port: "80"
    healthcheck:
      # Base image is php:*-apache (Debian) - curl is expected to be present,
      # but NOT verified live yet for this exact tag. Check with
      # `docker exec apps-espocrm which curl wget nc` before trusting this;
      # swap to wget/nc if curl is missing (see the DocuSeal lesson in
      # docs/02 - this has now happened twice, always verify before trusting
      # a healthcheck tool in a new image).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 768m

  espocrm-daemon:
    image: espocrm/espocrm:10.0.6-apache
    container_name: apps-espocrm-daemon
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [apps-internal]
    entrypoint: docker-daemon.sh
    environment:
      TZ: ${TZ}
    volumes_from: [espocrm]
    mem_limit: 384m

  # --- OPTIONAL: real-time websocket notifications ---
  # Uncomment only if live in-app notifications become a hard requirement -
  # the UI works fine without it (polling instead of push). Adds a ZeroMQ
  # dependency and its own exposed port; not worth the complexity for v1.
  # espocrm-websocket:
  #   image: espocrm/espocrm:10.0.6-apache
  #   container_name: apps-espocrm-websocket
  #   restart: unless-stopped
  #   networks: [edge, apps-internal]
  #   entrypoint: docker-websocket.sh
  #   environment:
  #     TZ: ${TZ}
  #     ESPOCRM_CONFIG_USE_WEB_SOCKET: "true"
  #     ESPOCRM_CONFIG_WEB_SOCKET_URL: "wss://crm.${PRIMARY_DOMAIN}/ws"
  #     ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBSCRIBER_DSN: "tcp://*:7777"
  #     ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBMISSION_DSN: "tcp://apps-espocrm-websocket:7777"
  #   volumes_from: [espocrm]
  #   mem_limit: 256m
