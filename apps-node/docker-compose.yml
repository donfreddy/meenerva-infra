# =============================================================================
# meenerva-infra :: apps-node edge stack
# Runs on: Contabo Cloud VPS 8 (apps-node, WireGuard 10.10.0.2)
#
# apps-node runs its OWN Traefik (decision D-05). Application stacks live under
# apps/<name>/ and are deployed independently via `git pull` + `make app-up`
# (D-12/D-15); they join the `edge` network created here.
#
# Shared services on core-node (PostgreSQL, Redis, outbound SMTP) are reached
# over WireGuard at 10.10.0.1. Identity is reached at https://id.<domain>.
# MariaDB is the one shared data store that lives HERE instead, mutualized
# across apps-node apps the same way core-postgres is (D-04) - see the
# `mariadb` service below for why it does not need the same edge/mesh
# treatment as core-postgres/core-redis.
# =============================================================================

name: meenerva-apps

networks:
  edge:
    name: edge
    driver: bridge
  apps-internal:
    name: apps-internal
    driver: bridge
    internal: true

volumes:
  traefik-acme:
  apps-offsite-cache:
  mariadb-data:
  mariadb-dumps:
  # Each app below is its OWN compose project (make app-up NAME=<app>), so its
  # volumes live in a different Docker Compose namespace than this file's.
  # Referencing them here as `external: true` is the only way offsite-backup
  # (which runs in the `meenerva-apps` project) can mount them. The prefix is
  # each app's compose project name - its `name:` field, which every app here
  # sets (confirmed live via `docker volume ls` on apps-node 2026-09-17: all
  # nine of these are prefixed `meenerva-<app>_`, no exceptions). If a new
  # app's `name:` field is ever added/changed, update the prefix here too or
  # the mount silently 404s at `make apps-up` - verify with `docker volume ls`
  # rather than assuming.
  nextcloud-data:
    external: true
    name: meenerva-nextcloud_nextcloud-data
  mattermost-data:
    external: true
    name: meenerva-mattermost_mattermost-data
  mattermost-config:
    external: true
    name: meenerva-mattermost_mattermost-config
  frappe-sites:
    external: true
    name: meenerva-frappe_frappe-sites
  espocrm-data:
    external: true
    name: meenerva-espocrm_espocrm-data
  espocrm-custom:
    external: true
    name: meenerva-espocrm_espocrm-custom
  espocrm-client-custom:
    external: true
    name: meenerva-espocrm_espocrm-client-custom
  docuseal-data:
    external: true
    name: meenerva-docuseal_docuseal-data
  openproject-data:
    external: true
    name: meenerva-openproject_openproject-data

services:

  traefik:
    image: traefik:v3.7.13
    container_name: apps-traefik
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [edge]
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: ${TZ}
      TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/acme
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.traefik.rule: Host(`traefik-apps.${PRIMARY_DOMAIN}`)
      traefik.http.routers.traefik.entrypoints: websecure
      traefik.http.routers.traefik.tls.certresolver: letsencrypt
      traefik.http.routers.traefik.service: api@internal
      traefik.http.middlewares.dashboard-auth.basicauth.users: ${TRAEFIK_DASHBOARD_AUTH}
      traefik.http.routers.traefik.middlewares: dashboard-auth,security-headers@file
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 20s
      timeout: 5s
      retries: 5


  # ===========================================================================
  # MariaDB :: shared relational database for apps-node apps that need
  # MySQL/MariaDB instead of Postgres (EspoCRM, and later ERPNext/Frappe HR -
  # see docs/09-roadmap.md Phase 4, moved up because EspoCRM needs it now).
  # Mirrors core-postgres's mutualization model (D-04): one database + user
  # per app, created with scripts/create-mysql-database.sh.
  #
  # Unlike core-postgres/core-redis (D-14), this does NOT join `edge` or
  # publish a port: its only consumers are other containers on THIS node,
  # which reach it over `apps-internal` directly - there is no cross-node
  # mesh hop to support, so none of D-14's "internal-only network breaks
  # published ports" problem applies (that problem is specific to published
  # ports, not container-to-container traffic on the same network/host).
  # If a future node ever needs to reach this MariaDB remotely, revisit this
  # the same way D-14 was resolved for core-postgres, don't assume the fix
  # transfers automatically.
  # ===========================================================================
  mariadb:
    image: mariadb:11.4.13
    container_name: apps-mariadb
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [apps-internal]
    environment:
      TZ: ${TZ}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 768m

  # ===========================================================================
  # mariadb-backup :: nightly mysqldump of every database in apps-mariadb
  # (local dump only, mirrors core-postgres-backup's role for core-postgres -
  # see docs/06-secrets-and-backups.md). Dumping via mysqldump instead of
  # letting offsite-backup tar the live /var/lib/mysql datadir avoids shipping
  # a torn, inconsistent copy of a database that's being written to while the
  # tar runs. One .sql.gz per database, so EspoCRM's and Frappe's actual
  # records (unlike their file-only volumes already wired below) are finally
  # covered. offsite-backup then picks this dump directory up like any other
  # volume and ships it to B2 - this container does NOT talk to B2 itself, to
  # keep B2 credentials and retention policy in one place.
  # ===========================================================================
  mariadb-backup:
    image: fradelg/mysql-cron-backup:1.14.0
    container_name: apps-mariadb-backup
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    depends_on:
      mariadb:
        condition: service_healthy
    networks: [apps-internal]
    environment:
      TZ: ${TZ}
      MYSQL_HOST: apps-mariadb
      MYSQL_USER: root
      MYSQL_PASS: ${MARIADB_ROOT_PASSWORD}
      CRON_TIME: ${BACKUP_CRON}
      INIT_BACKUP: "1"
      # Count of dump cycles kept locally, not calendar days (this image has
      # no week/month tiers like postgres-backup-local) - one BACKUP_CRON run
      # per day makes this a reasonable stand-in for BACKUP_RETENTION_DAYS.
      MAX_BACKUPS: ${BACKUP_RETENTION_DAYS}
    volumes:
      - mariadb-dumps:/backup
    mem_limit: 192m

  # Off-site backup of apps-node volumes to Backblaze B2.
  offsite-backup:
    image: offen/docker-volume-backup:v2.43.0
    container_name: apps-offsite-backup
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: ${BACKUP_CRON}
      BACKUP_FILENAME: "meenerva-apps-%Y%m%dT%H%M%S.tar.gz"
      BACKUP_PRUNING_PREFIX: "meenerva-apps-"
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      GPG_PASSPHRASE: ${RESTIC_PASSWORD}
      AWS_ENDPOINT: ${B2_S3_ENDPOINT}
      AWS_S3_BUCKET_NAME: ${B2_BUCKET}
      AWS_ACCESS_KEY_ID: ${B2_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${B2_SECRET_ACCESS_KEY}
      AWS_S3_PATH: apps-node
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - apps-offsite-cache:/backup/cache
      - nextcloud-data:/backup/nextcloud-data:ro
      - mattermost-data:/backup/mattermost-data:ro
      - mattermost-config:/backup/mattermost-config:ro
      - frappe-sites:/backup/frappe-sites:ro
      - espocrm-data:/backup/espocrm-data:ro
      - espocrm-custom:/backup/espocrm-custom:ro
      - espocrm-client-custom:/backup/espocrm-client-custom:ro
      - docuseal-data:/backup/docuseal-data:ro
      - openproject-data:/backup/openproject-data:ro
      - mariadb-dumps:/backup/mariadb-dumps:ro
      # Deliberately NOT mariadb-data itself: that's the live datadir. The
      # mariadb-backup service above dumps it to mariadb-dumps as consistent
      # per-database .sql.gz files, which is what gets shipped here instead.
    mem_limit: 256m
